name: uptime

# Vendor-free synthetic monitoring.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Overlapping runs could each see no open issue and both report.
concurrency:
  group: uptime

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe production
        run: |
          set -e
          curl -fsS -o /dev/null -m 15 https://calebroseland.com/
          curl -fsS -m 15 https://calebroseland.com/api/health | grep -q '"ok":true'
      - if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "Uptime probe failed";
            // Matched by title: GitHub silently drops a label the token cannot set.
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", per_page: 100 });
            if (open.some((issue) => issue.title === title && !issue.pull_request)) return;
            const body = `Probe failed at ${new Date().toISOString()}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({ ...context.repo, title, body, labels: ["uptime"] });
