name: deploy

on:
  push:
    branches: [master]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  worker:
    needs: ci
    name: deploy production worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://calebroseland.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with: { cache: true }
      - run: npm ci
      - run: mise run build
        env: { GITHUB_SHA: "${{ github.sha }}" }
      - run: npx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx playwright install --with-deps chromium
      - run: mise run smoke
        env:
          # Until cutover the production Worker is only reachable on workers.dev; switch to the apex in Phase C.
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://calebroseland.com' }}
          EXPECTED_SHA: ${{ github.sha }}

  pages:
    needs: ci
    name: deploy pages backup
    uses: ./.github/workflows/pages.yml
    secrets: inherit
