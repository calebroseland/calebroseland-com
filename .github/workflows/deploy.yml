name: deploy

on:
  push:
    branches: [master]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  worker:
    needs: ci
    name: deploy production worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: production
      url: https://calebroseland.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with: { cache: true }
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: worker-build, path: apps/web }
      - id: deploy
        run: npx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx playwright install --with-deps chromium
      - id: smoke
        run: mise run smoke
        env:
          BASE_URL: https://calebroseland.com
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_ENV: production
      - if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: npx wrangler rollback --yes --message "smoke failed for ${GITHUB_SHA::7}"
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Smoke failed for ${GITHUB_SHA::7} after deploy; production was rolled back to the previous version. Run: ${RUN_URL}"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq 'map(select(.merged_at)) | .[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "$body"
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$body" > /dev/null
          fi

  pages:
    needs: ci
    name: deploy pages backup
    uses: ./.github/workflows/pages.yml
    secrets: inherit
