name: preview-teardown

# Outside pr.yml so an unlabel never reruns CI.
on:
  pull_request:
    types: [unlabeled, closed]

permissions:
  contents: read

jobs:
  teardown:
    name: preview-teardown
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && ((github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      || (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      deployment: false
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: active
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=$PREVIEW_NAME-preview" --jq '.[].id' \
            | while read -r id; do
                state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
                if [ "$state" = success ]; then echo "$id"; fi
              done | xargs)
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - if: steps.active.outputs.ids
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1 }
      - if: steps.active.outputs.ids
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with: { cache: true }
      - if: steps.active.outputs.ids
        run: npm ci
      - if: steps.active.outputs.ids
        run: npx wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.active.outputs.ids
        env:
          IDS: ${{ steps.active.outputs.ids }}
        run: |
          for id in $IDS; do
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=inactive > /dev/null
          done
