name: ci

on:
  pull_request:
  push:
    branches: [next, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1 }
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with: { cache: true }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: mise run check
      - run: mise run build
      - run: mise run size
      - run: mise run knip
      - run: npm audit --omit=dev --audit-level=moderate
      - name: No credentials in client-visible config
        run: |
          ! grep -RInE "(VITE_[A-Z_]*(SECRET|TOKEN|KEY)|CLIENT_SECRET\s*[:=]\s*['\"][^'\"]+)" apps/web/src apps/web/vite.config.ts apps/web/wrangler.jsonc apps/web/.dev.vars.example

  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2 }
      - name: Skip for content-only changes
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qvE '^(content/|.*\.md$)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.filter.outputs.run == 'true'
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with: { cache: true }
      - if: steps.filter.outputs.run == 'true'
        run: npm ci
      - if: steps.filter.outputs.run == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.filter.outputs.run == 'true'
        run: mise run test:e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
