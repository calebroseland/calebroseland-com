name: ci

on:
  pull_request:
  push:
    branches: [next, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad4ec120d5209a95 # v4.3.1
        with: { fetch-depth: 1 }
      - uses: jdx/mise-action@5cb1df66ed5e1fb3c670ea0b62fd17a76979826a # v2.3.1
        with: { cache: true }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: mise run check
      - run: mise run build
      - run: mise run size
      - run: mise run knip
      - run: npm audit --omit=dev --audit-level=moderate
      - name: No credentials in client-visible config
        run: |
          ! grep -RInE "(VITE_[A-Z_]*(SECRET|TOKEN|KEY)|CLIENT_SECRET\s*[:=]\s*['\"][^'\"]+)" apps/web/src apps/web/vite.config.ts apps/web/wrangler.jsonc apps/web/.dev.vars.example

  e2e:
    name: e2e
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad4ec120d5209a95 # v4.3.1
        with: { fetch-depth: 2 }
      - name: Skip for content-only changes
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -qvE '^(content/|.*\.md$)'; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.filter.outputs.run == 'true'
        uses: jdx/mise-action@5cb1df66ed5e1fb3c670ea0b62fd17a76979826a # v2.3.1
        with: { cache: true }
      - if: steps.filter.outputs.run == 'true'
        run: npm ci
      - if: steps.filter.outputs.run == 'true'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.filter.outputs.run == 'true'
        run: mise run test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
