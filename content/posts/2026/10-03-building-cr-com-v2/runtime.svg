<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="564" viewBox="0 0 1200 564" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">CR-COM v2 runtime</title>
  <desc id="d">Every request reaches one Cloudflare Worker per environment. Paths under /api/ go to four handlers (health, auth config, auth callback, log); everything else is served from static assets with security headers. The Pages backup calls the production API cross-origin. With GitHub editing on, the browser talks to api.github.com directly, and sign-in redeems its code through the Worker.</desc>
  <style>
    .bg{fill:#fbfaf7}.panel{fill:#f3f0ea;stroke:#e2ddd2}.box{fill:#fff;stroke:#c9c3b6}
    .cf{fill:#fff7f1;stroke:#d9662a}.gh{fill:#f3f6fd;stroke:#4a6fc9}.ok{fill:#f2f8f4;stroke:#3f8a5c}
    .ghost{fill:none;stroke:#b3ad9f;stroke-dasharray:5 4}
    .t{fill:#1d1b17}.m{fill:#6b655a}.cfT{fill:#b4501b}.ghT{fill:#2f55b0}.okT{fill:#2f7a4b}
    .ln{stroke:#8d8678;fill:none;stroke-width:1.6}.dash{stroke-dasharray:6 5}
    .ah{fill:#8d8678}
    .h{font-size:22px;font-weight:700}.sub{font-size:16px}.b{font-size:16px;font-weight:600}
    .s{font-size:14.5px}.xs{font-size:13px}.cap{font-size:12.5px;font-weight:600;letter-spacing:.08em}
    .mono{font-family:IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#16151a}.panel{fill:#1d1c22;stroke:#2c2a33}.box{fill:#24232a;stroke:#46434e}
      .cf{fill:#2a1f19;stroke:#e07a3e}.gh{fill:#1a2030;stroke:#6f93f0}.ok{fill:#18241d;stroke:#5fb582}
      .ghost{stroke:#5b5865}
      .t{fill:#ecebe7}.m{fill:#a29e95}.cfT{fill:#f19a62}.ghT{fill:#93b0ff}.okT{fill:#7fcf9e}
      .ln{stroke:#8a8694}.ah{fill:#8a8694}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="564" rx="18"/>
  <g transform="translate(0 -716)">
  <!-- ───────── 2 · Runtime ───────── -->
  <rect class="panel" x="20" y="736" width="1160" height="524" rx="14"/>
  <text class="t h" x="40" y="772">2 · Runtime</text>
  <text class="m sub" x="170" y="772">one Worker per environment; GitHub is the only other backend</text>

  <!-- browser -->
  <rect class="ghost" x="40" y="822" width="230" height="318" rx="12"/>
  <text class="m cap" x="56" y="846">BROWSER</text>
  <rect class="box" x="56" y="862" width="198" height="120" rx="10"/>
  <text class="t b" x="72" y="890">React SPA</text>
  <text class="m s" x="72" y="914">TanStack Router</text>
  <text class="m s" x="72" y="936">editor is a lazy chunk</text>
  <text class="m s" x="72" y="958">CSP: connect-src self + GitHub</text>
  <rect class="gh" x="56" y="1000" width="198" height="120" rx="10"/>
  <text class="ghT b" x="72" y="1028">Pages backup</text>
  <text class="m s" x="72" y="1052">same SPA, static only</text>
  <text class="m s" x="72" y="1074">its /api calls go to</text>
  <text class="m s" x="72" y="1096">production, cross-origin</text>

  <!-- worker -->
  <rect class="cf" x="330" y="810" width="470" height="340" rx="12"/>
  <text class="cfT b" x="350" y="838">Cloudflare Worker</text>
  <text class="m xs mono" x="510" y="838">worker/index.ts</text>
  <rect class="box" x="350" y="854" width="430" height="44" rx="8"/>
  <text class="t s" x="565" y="882" text-anchor="middle">path starts with <tspan class="mono">/api/</tspan> ?</text>
  <rect class="box" x="350" y="930" width="200" height="200" rx="10"/>
  <text class="t b" x="366" y="958">no → ASSETS</text>
  <text class="m s" x="366" y="984">built SPA + hashed</text>
  <text class="m s" x="366" y="1004">assets</text>
  <text class="m s" x="366" y="1030">SPA fallback for</text>
  <text class="m s" x="366" y="1050">deep links</text>
  <text class="m s" x="366" y="1076">security headers</text>
  <text class="m s" x="366" y="1096">from <tspan class="mono">_headers</tspan></text>
  <rect class="box" x="570" y="930" width="210" height="200" rx="10"/>
  <text class="t b" x="586" y="958">yes → handler</text>
  <text class="t xs mono" x="586" y="986">GET  /api/health</text>
  <text class="t xs mono" x="586" y="1010">GET  /api/auth/config</text>
  <text class="t xs mono" x="586" y="1034">POST /api/auth/callback</text>
  <text class="t xs mono" x="586" y="1058">POST /api/log</text>
  <text class="m s" x="586" y="1088">else 404,</text>
  <text class="m s mono xs" x="586" y="1108">problem+json</text>
  <path class="ln" d="M565 898V912H450V926" marker-end="url(#a)"/>
  <path class="ln" d="M565 912H675V926" marker-end="url(#a)"/>

  <!-- external -->
  <rect class="gh" x="840" y="822" width="320" height="104" rx="10"/>
  <text class="ghT b" x="858" y="850">github.com OAuth</text>
  <text class="t s mono" x="858" y="876">/login/oauth/authorize</text>
  <text class="t s mono" x="858" y="900">/login/oauth/access_token</text>
  <rect class="gh" x="840" y="946" width="320" height="88" rx="10"/>
  <text class="ghT b" x="858" y="974">api.github.com</text>
  <text class="m s" x="858" y="1000">Octokit; the token never</text>
  <text class="m s" x="858" y="1020">leaves the browser</text>
  <rect class="box" x="840" y="1054" width="320" height="76" rx="10"/>
  <text class="t b" x="858" y="1082">Workers observability</text>
  <text class="m s" x="858" y="1108">client errors via /api/log</text>

  <!-- runtime arrows -->
  <path class="ln" d="M254 876H346" marker-end="url(#a)"/>
  <text class="m xs" x="262" y="868">every request</text>
  <path class="ln dash" d="M155 1120V1196H675V1134" marker-end="url(#a)"/>
  <text class="m xs" x="300" y="1190">cross-origin, allowed by ALLOWED_ORIGINS</text>
  <path class="ln" d="M780 1022H812V880H836" marker-end="url(#a)"/>
  <path class="ln" d="M780 1094H836" marker-end="url(#a)"/>
  <path class="ln dash" d="M155 862V798H1172V990H1164" marker-end="url(#a)"/>
  <text class="m xs" x="840" y="792">GitHub editing (flag on): content reads and commits</text>

  <text class="m s" x="40" y="1228">Sign-in (flag on): SPA → github.com authorize with PKCE → /login/callback → POST /api/auth/callback → Worker adds</text>
  <text class="m s" x="40" y="1248">the client secret and redeems the code → token returns to the browser. The Worker never stores it.</text>

    </g>
</svg>
