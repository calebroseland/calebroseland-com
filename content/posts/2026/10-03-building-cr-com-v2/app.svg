<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Inside the CR-COM v2 app</title>
  <desc id="d">The root shell and its routes; build-time content flowing from content/ through the Vite content plugin into virtual modules; editor screens calling purpose-named hooks and one query client that picks a working-tree, fake GitHub, or real GitHub backend; and the state order URL, server, form, client.</desc>
  <style>
    .bg{fill:#fbfaf7}.panel{fill:#f3f0ea;stroke:#e2ddd2}.box{fill:#fff;stroke:#c9c3b6}
    .cf{fill:#fff7f1;stroke:#d9662a}.gh{fill:#f3f6fd;stroke:#4a6fc9}.ok{fill:#f2f8f4;stroke:#3f8a5c}
    .ghost{fill:none;stroke:#b3ad9f;stroke-dasharray:5 4}
    .t{fill:#1d1b17}.m{fill:#6b655a}.cfT{fill:#b4501b}.ghT{fill:#2f55b0}.okT{fill:#2f7a4b}
    .ln{stroke:#8d8678;fill:none;stroke-width:1.6}.dash{stroke-dasharray:6 5}
    .ah{fill:#8d8678}
    .h{font-size:22px;font-weight:700}.sub{font-size:16px}.b{font-size:16px;font-weight:600}
    .s{font-size:14.5px}.xs{font-size:13px}.cap{font-size:12.5px;font-weight:600;letter-spacing:.08em}
    .mono{font-family:IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#16151a}.panel{fill:#1d1c22;stroke:#2c2a33}.box{fill:#24232a;stroke:#46434e}
      .cf{fill:#2a1f19;stroke:#e07a3e}.gh{fill:#1a2030;stroke:#6f93f0}.ok{fill:#18241d;stroke:#5fb582}
      .ghost{stroke:#5b5865}
      .t{fill:#ecebe7}.m{fill:#a29e95}.cfT{fill:#f19a62}.ghT{fill:#93b0ff}.okT{fill:#7fcf9e}
      .ln{stroke:#8a8694}.ah{fill:#8a8694}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="580" rx="18"/>
  <g transform="translate(0 -1260)">
  <!-- ───────── 3 · Inside the app ───────── -->
  <rect class="panel" x="20" y="1280" width="1160" height="540" rx="14"/>
  <text class="t h" x="40" y="1316">3 · Inside the app</text>
  <text class="m sub" x="232" y="1316">shell and routes, published content, editor data</text>

  <!-- shell -->
  <text class="m cap" x="40" y="1352">APP SHELL</text>
  <rect class="box" x="40" y="1364" width="520" height="92" rx="10"/>
  <text class="t b mono" x="58" y="1390">__root.tsx</text>
  <text class="m s" x="58" y="1414">HeadContent · skip link · Toasts · CommandPalette</text>
  <text class="m s" x="58" y="1438">TipProvider › MotionProvider › <tspan class="mono">&lt;Outlet/&gt;</tspan></text>
  <path class="ln" d="M64 1456V1638"/>
  <g class="s">
    <path class="ln" d="M64 1488H80"/><text class="t mono" x="88" y="1493">_card</text><text class="t mono" x="196" y="1493">/  /contact</text><text class="m" x="400" y="1493">landing card</text>
    <path class="ln" d="M64 1518H80"/><text class="t mono" x="88" y="1523">home</text><text class="t mono" x="196" y="1523">/home</text>
    <path class="ln" d="M64 1548H80"/><text class="t mono" x="88" y="1553">posts</text><text class="t mono" x="196" y="1553">/posts  /posts/$slug</text>
    <path class="ln" d="M64 1578H80"/><text class="t mono" x="88" y="1583">$slug</text><text class="t mono" x="196" y="1583">/about  /privacy …</text><text class="m" x="400" y="1583">pages</text>
    <path class="ln" d="M64 1608H80"/><text class="t mono" x="88" y="1613">login</text><text class="t mono" x="196" y="1613">/login  /login/callback</text>
    <path class="ln" d="M64 1638H80"/><text class="t mono" x="88" y="1643">editor</text><text class="t mono" x="196" y="1643">/editor  /new  /$slug</text><text class="m" x="400" y="1643">lazy</text>
  </g>

  <!-- published content -->
  <text class="m cap" x="600" y="1352">PUBLISHED CONTENT · BUILD TIME</text>
  <rect class="box" x="600" y="1364" width="150" height="92" rx="10"/>
  <text class="t b mono" x="616" y="1394">content/</text>
  <text class="m s" x="616" y="1418">markdown</text>
  <text class="m s" x="616" y="1438">yaml</text>
  <rect class="ok" x="780" y="1364" width="200" height="92" rx="10"/>
  <text class="okT b" x="796" y="1390">Vite content plugin</text>
  <text class="m s" x="796" y="1414">Zod · remark / rehype</text>
  <text class="m s" x="796" y="1436">Shiki · hashed assets</text>
  <rect class="box" x="1010" y="1364" width="150" height="92" rx="10"/>
  <text class="t xs mono" x="1024" y="1392">virtual:content/</text>
  <text class="m s" x="1024" y="1416">profile · index</text>
  <text class="m s" x="1024" y="1438">theme · entry</text>
  <path class="ln" d="M750 1410H776" marker-end="url(#a)"/>
  <path class="ln" d="M980 1410H1006" marker-end="url(#a)"/>

  <!-- editor data -->
  <text class="m cap" x="600" y="1492">EDITOR DATA · RUNTIME</text>
  <rect class="box" x="600" y="1504" width="150" height="66" rx="10"/>
  <text class="t b" x="616" y="1530">Screens</text>
  <text class="m xs" x="616" y="1552">toasts, copy, navigation</text>
  <rect class="box" x="780" y="1504" width="200" height="66" rx="10"/>
  <text class="t b" x="796" y="1530">Purpose-named hooks</text>
  <text class="m xs mono" x="796" y="1552">useEntry · useSaveDraft</text>
  <rect class="box" x="1010" y="1504" width="150" height="66" rx="10"/>
  <text class="t b" x="1026" y="1530">Query client</text>
  <text class="m xs" x="1026" y="1552">one, created lazily</text>
  <path class="ln" d="M750 1537H776" marker-end="url(#a)"/>
  <path class="ln" d="M980 1537H1006" marker-end="url(#a)"/>
  <path class="ln" d="M1085 1570V1592H690V1610" marker-end="url(#a)"/>
  <path class="ln" d="M880 1592V1610" marker-end="url(#a)"/>
  <path class="ln" d="M1085 1592V1610" marker-end="url(#a)"/>
  <text class="m xs" x="702" y="1586">backend chosen by its capabilities</text>
  <rect class="ok" x="600" y="1614" width="180" height="80" rx="10"/>
  <text class="okT b" x="616" y="1640">Working tree</text>
  <text class="m xs mono" x="616" y="1662">/@local/* (dev)</text>
  <text class="m xs" x="616" y="1682">writes content/ on disk</text>
  <rect class="box" x="790" y="1614" width="180" height="80" rx="10"/>
  <text class="t b" x="806" y="1640">Fake GitHub</text>
  <text class="m xs" x="806" y="1662">in memory + localStorage</text>
  <text class="m xs" x="806" y="1682">flag</text>
  <rect class="gh" x="980" y="1614" width="180" height="80" rx="10"/>
  <text class="ghT b" x="996" y="1640">GitHub · Octokit</text>
  <text class="m xs" x="996" y="1662">pasted token or OAuth</text>
  <text class="m xs" x="996" y="1682">flag</text>

  <!-- state order -->
  <text class="m cap" x="40" y="1726">STATE ORDER · CHECK EACH NEW PIECE OF STATE TOP TO BOTTOM</text>
  <rect class="box" x="40" y="1740" width="250" height="56" rx="10"/>
  <text class="t b" x="58" y="1774">1  URL <tspan class="m s" font-weight="400">· Router</tspan></text>
  <rect class="box" x="330" y="1740" width="250" height="56" rx="10"/>
  <text class="t b" x="348" y="1774">2  Server <tspan class="m s" font-weight="400">· Query</tspan></text>
  <rect class="box" x="620" y="1740" width="250" height="56" rx="10"/>
  <text class="t b" x="638" y="1774">3  Form <tspan class="m s" font-weight="400">· Form + Zod + Base UI</tspan></text>
  <rect class="box" x="910" y="1740" width="250" height="56" rx="10"/>
  <text class="t b" x="928" y="1774">4  Client <tspan class="m s" font-weight="400">· Store</tspan></text>
  <path class="ln" d="M290 1768H326" marker-end="url(#a)"/>
  <path class="ln" d="M580 1768H616" marker-end="url(#a)"/>
  <path class="ln" d="M870 1768H906" marker-end="url(#a)"/>
  </g>
</svg>
